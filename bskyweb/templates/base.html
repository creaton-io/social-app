<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
  <meta name="referrer" content="origin-when-cross-origin">
  <!--
    Preconnect to essential domains
  -->
  <link rel="preconnect" href="https://bsky.social">
  <link rel="preconnect" href="https://bsky.network">
  <link rel="preconnect" href="https://creaton.social">
  <link rel="preconnect" href="https://creaton.io">
  <title>{%- block head_title -%}Creaton{%- endblock -%}</title>

  <!-- Hello Humans! API docs at https://atproto.com -->

  <link rel="preload" as="font" type="font/woff2"
    href="{{ staticCDNHost }}/static/media/InterVariable.c504db5c06caaf7cdfba.woff2" crossorigin>

  <style>
    /**
     * Minimum styles required to render splash.
     *
     * ALL OTHER STYLES BELONG IN `src/style.css`
     *
     * THIS NEEDS TO BE DUPLICATED IN `bskyweb/templates/base.html`
     */
    @font-face {
      font-family: 'InterVariable';
      src: url("{{ staticCDNHost }}/static/media/InterVariable.c504db5c06caaf7cdfba.woff2") format('woff2');
      font-weight: 300 1000;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'InterVariableItalic';
      src: url("{{ staticCDNHost }}/static/media/InterVariable-Italic.01dcbad1bac635f9c9cd.woff2") format('woff2');
      font-weight: 300 1000;
      font-style: italic;
      font-display: swap;
    }

    html {
      background-color: white;
    }

    @media (prefers-color-scheme: dark) {
      html {
        background-color: black;
      }
    }

    html,
    body {
      margin: 0px;
      padding: 0px;
      font-family: InterVariable, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Liberation Sans', Helvetica, Arial, sans-serif;
      text-rendering: optimizeLegibility;
      /* Platform-specific reset */
      -webkit-overflow-scrolling: touch;
      -webkit-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -ms-overflow-style: scrollbar;
      font-synthesis-weight: none;
    }

    html,
    body,
    #root {
      display: flex;
      flex: 1 0 auto;
      min-height: 100%;
      width: 100%;
    }

    #splash {
      position: fixed;
      width: 100px;
      left: 50%;
      top: 50%;
      transform: translateX(-50%) translateY(-50%) translateY(-50px);
    }

    /**
     * We need these styles to prevent shifting due to scrollbar show/hide on
     * OSs that have them enabled by default. This also handles cases where the
     * screen wouldn't otherwise scroll, and therefore hide the scrollbar and
     * shift the content, by forcing the page to show a scrollbar.
     */
    body {
      width: 100%;
      overflow-y: scroll;
    }
  </style>

  {% include "scripts.html" %}
  <link rel="apple-touch-icon" sizes="180x180" href="{{ staticCDNHost }}/static/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ staticCDNHost }}/static/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ staticCDNHost }}/static/favicon-16x16.png">
  <link rel="mask-icon" href="{{ staticCDNHost }}/static/safari-pinned-tab.svg" color="#1185fe">
  <meta name="theme-color">
  <meta name="application-name" content="Creaton">
  <meta name="generator" content="bskyweb">
  <meta property="og:site_name" content="Creaton Social" />
  <link type="application/activity+json" href="" />

  {% block html_head_extra -%}{%- endblock %}
</head>

<body>
  {%- block body_all %}
  <div id="root">
    <div id="splash">
      <!-- Creaton SVG -->
      <svg version="1.2" baseProfile="tiny-ps" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100"
        height="100">
        <title>Creaton new logo-ai</title>
        <defs>
          <linearGradient id="grd1" gradientUnits="userSpaceOnUse" x1="166.696" y1="153.348" x2="79.279" y2="196.092">
            <stop offset="0" stop-color="#63c88e" />
            <stop offset="1" stop-color="#26359c" />
          </linearGradient>
          <linearGradient id="grd2" gradientUnits="userSpaceOnUse" x1="15" y1="72.359" x2="91.248" y2="72.359">
            <stop offset="0" stop-color="#63c88e" />
            <stop offset="1" stop-color="#26359c" />
          </linearGradient>
        </defs>
        <style>
          tspan {
            white-space: pre
          }

          .shp0 {
            fill: #43e296
          }

          .shp1 {
            fill: url(#grd1)
          }

          .shp2 {
            fill: #42389d
          }

          .shp3 {
            fill: url(#grd2)
          }
        </style>
        <g id="Layer 1">
          <g id="&lt;Group&gt;">
            <g id="&lt;Group&gt;">
              <path id="&lt;Path&gt;" class="shp0"
                d="M98.52 58.38L65.14 24.84L117.33 24.91L150.97 58.44C136.47 72.93 112.97 72.91 98.52 58.38Z" />
              <path id="&lt;Path&gt;" class="shp1"
                d="M91.25 148.93L42.4 100.09L117.33 24.91L65.14 24.84L15.52 74.46L15.52 125.7L65.02 175.16L117.53 175.16L149.53 143.16C135.03 128.66 111.52 128.66 97.02 143.16L91.25 148.93Z" />
              <path id="&lt;Path&gt;" class="shp2"
                d="M97.08 143.1L65.02 175.16L117.53 175.16L149.53 143.16L149.47 143.1C135 128.64 111.55 128.64 97.08 143.1Z" />
              <path id="&lt;Path&gt;" class="shp3"
                d="M42.4 100.09L15.52 74.36L15 125.35L65.02 175.16L91.25 148.94L42.4 100.09Z" />
              <path id="&lt;Path&gt;" class="shp0"
                d="M116.55 99.81L91.49 124.87L66.42 99.81L91.49 74.75L116.55 99.81Z" />
            </g>
          </g>
        </g>
      </svg>
    </div>
  </div>

  <noscript>
    <h1 lang="en">JavaScript Required</h1>
    <p lang="en">This is a heavily interactive web application, and JavaScript is required. Simple HTML interfaces are
      possible, but that is not what this is.
      <p lang="en">Learn more about Creaton at <a href="https://creaton.social">creaton.social</a> and <a
          href="https://atproto.com">atproto.com</a>.
        {% block noscript_extra %}{% endblock %}
  </noscript>
  {% endblock -%}
</body>

</html>
